{% extends "base.html" %}
{% block title %}Profile Picture – TCN{% endblock %}

{% block body %}
<h2>Update Profile Picture</h2>
<p class="lead">Upload a clear photo of yourself (max 5 MB).</p>

<form method="POST" enctype="multipart/form-data" class="form-card">
    <label for="profile_pic">Choose image</label>
    <input type="file" id="profile_pic" name="profile_pic" accept="image/*" required>

    <button type="submit">Upload</button>
</form>

<p style="margin-top:1rem"><a href="{{ url_for('dashboard') }}">← Back to Dashboard</a></p>
{% endblock %}
