{% extends "base.html" %}
{% block title %}Register as Customer – TCN{% endblock %}

{% block body %}
<h2>Register as Customer</h2>
<p class="lead">Create an account to book local freelancers.</p>

<form method="POST" class="form-card">
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" required>

    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name" required>

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="phone" required placeholder="08x xxx xxxx">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="6">

    <button type="submit">Create Account</button>
</form>

<p style="margin-top:1rem">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
{% endblock %}
