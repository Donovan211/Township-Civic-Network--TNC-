{% extends "base.html" %}
{% block title %}Forgot Password – TCN{% endblock %}

{% block body %}
<h2>Forgot Password</h2>
<p class="lead">Enter your registered email. For this prototype the reset link will be shown on screen.</p>

<form method="POST" class="form-card">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>

    <button type="submit">Generate Reset Link</button>
</form>

<p style="margin-top:1rem"><a href="{{ url_for('login') }}">← Back to Login</a></p>
{% endblock %}
